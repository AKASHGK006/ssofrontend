<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSO Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Inter, Segoe UI, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0078D4,#6B46C1);
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    background:#0078D4;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

h1{
    margin-top:20px;
    font-size:24px;
    color:#222;
}

.subtitle{
    color:#666;
    margin-top:8px;
    margin-bottom:25px;
}

.btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.login-btn{
    background:#0078D4;
    color:white;
}

.login-btn:hover{
    background:#0066b8;
}

.logout-btn{
    background:#dc3545;
    color:white;
}

.logout-btn:hover{
    background:#c82333;
}

.profile{
    display:none;
    margin-top:25px;
    text-align:left;
}

.profile-item{
    background:#f5f7fa;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.label{
    font-size:12px;
    color:#777;
}

.value{
    font-size:15px;
    color:#222;
    font-weight:600;
}

.status{
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    background:#e8f5e9;
    color:#2e7d32;
    font-weight:600;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#888;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="logo">M</div>

        <h1>Microsoft Entra SSO</h1>
        <p class="subtitle">
            Sign in using your Microsoft account
        </p>

        <button id="loginBtn" class="btn login-btn">
            Sign in with Microsoft
        </button>

        <button id="logoutBtn"
                class="btn logout-btn"
                style="display:none;">
            Logout
        </button>

        <div id="profile" class="profile">

            <div class="profile-item">
                <div class="label">Display Name</div>
                <div id="name" class="value">-</div>
            </div>

            <div class="profile-item">
                <div class="label">Email</div>
                <div id="email" class="value">-</div>
            </div>

            <div class="profile-item">
                <div class="label">Tenant ID</div>
                <div id="tenant" class="value">-</div>
            </div>

            <div class="status">
                ✓ Successfully Authenticated
            </div>

        </div>

        <div class="footer">
            Microsoft Entra ID Authentication Demo
        </div>

    </div>
</div>

<script type="module">

import {
    PublicClientApplication
} from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.14.0/+esm";

const msalConfig = {
    auth: {
        clientId: "747d3a85-9698-4e2c-b8b2-daec34b73768",
        authority:
            "https://login.microsoftonline.com/eb144c65-f215-4b78-a67d-30673cd1cec5",
        redirectUri: window.location.origin
    }
};

const loginRequest = {
    scopes: ["User.Read"]
};

const msalInstance =
    new PublicClientApplication(msalConfig);

await msalInstance.initialize();

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const profile =
    document.getElementById("profile");

async function login() {

    try {

        const response =
            await msalInstance.loginPopup(loginRequest);

        const account = response.account;

        document.getElementById("name").textContent =
            account.name || "N/A";

        document.getElementById("email").textContent =
            account.username || "N/A";

        document.getElementById("tenant").textContent =
            account.tenantId || "N/A";

        profile.style.display = "block";

        loginBtn.style.display = "none";
        logoutBtn.style.display = "block";

    } catch(error) {
        console.error(error);
        alert("Login Failed");
    }
}
    async function logout() {
    await msalInstance.logoutRedirect({
        account: msalInstance.getActiveAccount(),
        sessionStorage.clear();
        location.reload();
        postLogoutRedirectUri: window.location.origin
    });
}

loginBtn.addEventListener("click", login);
logoutBtn.addEventListener("click", logout);

</script>

</body>
</html>
